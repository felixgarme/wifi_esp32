<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-C3 Web Bluetooth</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f9;
            color: #333;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        button {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        button:hover { background-color: #005bb5; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #datos {
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            padding: 20px;
            border: 2px dashed #ccc;
            border-radius: 8px;
        }
        #estado { color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Conexión ESP32-C3</h2>
        <button id="btnConectar">Conectar por Bluetooth</button>
        <div id="estado">Esperando conexión...</div>
        <div id="datos">--</div>
    </div>

    <script>
        // Estos UUIDs deben SER LOS MISMOS que programes en tu ESP32-C3
        const SERVICE_UUID = '4fafc201-1fb5-459e-8fcc-c5c9c331914b';
        const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';

        const btnConectar = document.getElementById('btnConectar');
        const txtEstado = document.getElementById('estado');
        const txtDatos = document.getElementById('datos');

        btnConectar.addEventListener('click', async () => {
            try {
                txtEstado.innerText = 'Buscando ESP32...';
                
                // 1. Solicitar dispositivo (filtrando por el servicio UUID)
                const dispositivo = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }]
                });

                txtEstado.innerText = 'Conectando al dispositivo...';

                // Si el dispositivo se desconecta, mostrarlo
                dispositivo.addEventListener('gattserverdisconnected', () => {
                    txtEstado.innerText = 'Desconectado ❌';
                    btnConectar.disabled = false;
                });

                // 2. Conectar al servidor GATT
                const servidor = await dispositivo.gatt.connect();
                
                // 3. Obtener el servicio
                const servicio = await servidor.getPrimaryService(SERVICE_UUID);
                
                // 4. Obtener la característica
                const caracteristica = await servicio.getCharacteristic(CHARACTERISTIC_UUID);

                // 5. Iniciar las "Notificaciones" para escuchar en tiempo real
                await caracteristica.startNotifications();
                txtEstado.innerText = 'Conectado y escuchando ✅';
                btnConectar.disabled = true;

                // 6. Escuchar los eventos cada vez que el ESP32 envíe un dato
                caracteristica.addEventListener('characteristicvaluechanged', (event) => {
                    // Aquí decodificamos el valor enviado por el ESP32
                    // Asumimos que el ESP32 envía texto (String)
                    const decodificador = new TextDecoder('utf-8');
                    const valor = decodificador.decode(event.target.value);
                    
                    // Actualizar la pantalla
                    txtDatos.innerText = valor;
                    console.log('Dato recibido:', valor);
                });

            } catch (error) {
                console.error("Error: ", error);
                txtEstado.innerText = 'Error: ' + error.message;
            }
        });
    </script>
</body>
</html>
